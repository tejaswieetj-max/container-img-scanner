trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # FIXED: Changed from container-scan-cnct to your Docker Registry connection name
  dockerRegistryServiceConnection: 'container-registry-cnct'
  imageRepository: 'container-img-scanner'
  containerRegistry: 'containerimgscan.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: Build and Push Image
  inputs:
    command: buildAndPush
    repository: $(imageRepository)
    dockerfile: $(dockerfilePath)
    containerRegistry: $(dockerRegistryServiceConnection)
    tags: |
      $(tag)

- script: |
    echo "Container image built and pushed successfully."
  displayName: Verify Build