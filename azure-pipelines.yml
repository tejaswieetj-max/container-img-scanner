trigger:
  - main

variables:
  dockerRegistryServiceConnection: 'container-registry-cnct'
  imageRepository: 'dcba34'
  containerRegistry: 'containerimgscan.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
  - stage: BuildAndPush
    displayName: 'Stage 1 - Build and Push Image'
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  - stage: ScanGate
    displayName: 'Stage 2 - Vulnerability Scan Gate'
    dependsOn: BuildAndPush
    jobs:
      - job: WaitAndCheck
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Wait for scan, then check severity'
            inputs:
              azureSubscription: 'container-scan-cnct'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                 echo "Waiting for Microsoft Defender scan..."
                 sleep 300
                 echo "Installing Resource Graph extension..."
                 az extension add --name resource-graph --yes
                 STATUS=$(az graph query -q "securityresources | where type =~ 'microsoft.security/assessments' | where properties.resourceDetails.ResourceName == 'containerimgscan' | project status=properties.status.code" -o table)
                 echo "$STATUS"
                 if echo "$STATUS" | grep -qi "Unhealthy"; then
                    echo "========================================"
                    echo "HIGH / CRITICAL vulnerabilities found!"
                    echo "Blocking deployment..."
                    echo "========================================"
                    exit 1
                 else
                    echo "========================================"
                    echo "Image is Healthy."
                    echo "Deployment Allowed."
                    echo "========================================"
                 fi

  - stage: Deploy
    displayName: 'Stage 3 - Deploy'
    dependsOn: ScanGate
    condition: succeeded()
    jobs:
      - job: DeployApp
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: echo 'Deploying clean, scanned image to environment'
            displayName: 'Deploy step'