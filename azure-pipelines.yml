trigger:
  - main

variables:
  dockerRegistryServiceConnection: 'container-registry-cnct'
  imageRepository: 'dcba34'
  containerRegistry: 'containerimgscan.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
  - stage: BuildAndPush
    displayName: 'Stage 1 - Build and Push Image'
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: ScanGate
    displayName: 'Stage 2 - Vulnerability Scan Gate'
    dependsOn: BuildAndPush
    jobs:
      - job: TrivyScan
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Login to ACR for Scanner Authentication'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - script: |
              echo "Installing Trivy..."
              wget https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-64bit.deb
              sudo dpkg -i trivy_0.49.1_Linux-64bit.deb

              echo "Executing Instant Vulnerability Scan on $(containerRegistry)/$(imageRepository):$(tag)..."
              
              # Enforces the gate: Blocks deployment if High/Critical issues exist
              trivy image --exit-code 1 --severity HIGH,CRITICAL $(containerRegistry)/$(imageRepository):$(tag)
            displayName: 'Trivy Security Gate Execution'

  - stage: Deploy
    displayName: 'Stage 3 - Deploy'
    dependsOn: ScanGate
    condition: succeeded()
    jobs:
      - job: DeployApp
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: echo 'Deploying clean, scanned image to environment'
            displayName: 'Deploy step'